<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CM Coach — Nouveau mot de passe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card" id="auth-card">
    <div class="auth-brand">
      <div class="brand-mark">CM</div>
      <div class="brand-name">CM COACH</div>
    </div>
    <h2 style="margin:0 0 6px;font-size:16px;">Choisis un nouveau mot de passe</h2>
    <p style="margin:0 0 18px;font-size:12.5px;color:var(--text-dim);">Valable uniquement via le lien reçu par email.</p>

    <form id="reset-form">
      <div class="auth-field">
        <label class="field-label">Nouveau mot de passe</label>
        <input class="field-input" id="new-password" type="password" required minlength="6" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false">
      </div>
      <div class="auth-field">
        <label class="field-label">Confirme le mot de passe</label>
        <input class="field-input" id="confirm-password" type="password" required minlength="6" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false">
      </div>
      <button type="submit" class="btn" id="submit-btn" style="width:100%;">Enregistrer le mot de passe</button>
      <div class="auth-error" id="auth-error"></div>
    </form>
  </div>
</div>

<script src="config.js"></script>
<script>
  function showError(msg, isError){
    const el = document.getElementById('auth-error');
    el.textContent = msg;
    const ok = isError === false;
    el.style.color = ok ? 'var(--accent)' : 'var(--warn)';
    el.style.background = msg ? (ok ? 'rgba(247,199,37,0.14)' : 'rgba(255,133,98,0.14)') : 'none';
    el.style.border = msg ? '1px solid ' + (ok ? 'rgba(247,199,37,0.35)' : 'rgba(255,133,98,0.35)') : 'none';
    if (msg) {
      if (document.activeElement) document.activeElement.blur();
      el.scrollIntoView({ block: 'center' });
    }
  }

  let hasSession = false;
  supabaseClient.auth.onAuthStateChange(function(event, session){
    if (session) hasSession = true;
  });
  (async function(){
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) hasSession = true;
  })();

  document.getElementById('reset-form').addEventListener('submit', async function(e){
    e.preventDefault();
    showError('');
    const pw = document.getElementById('new-password').value.trim();
    const confirm = document.getElementById('confirm-password').value.trim();
    if (pw !== confirm) { showError('Les deux mots de passe ne correspondent pas.'); return; }
    if (!hasSession) { showError('Lien invalide ou expiré. Redemande un email depuis la page de connexion.'); return; }

    const submitBtn = document.getElementById('submit-btn');
    submitBtn.disabled = true;
    try {
      const { error } = await supabaseClient.auth.updateUser({ password: pw });
      if (error) throw error;
      await supabaseClient.auth.signOut();
      document.getElementById('auth-card').innerHTML =
        '<div class="auth-brand"><div class="brand-mark">CM</div><div class="brand-name">CM COACH</div></div>' +
        '<p style="font-size:13px;color:var(--text-dim);">Mot de passe mis à jour. <a href="index.html">Connecte-toi avec ton nouveau mot de passe</a>.</p>';
    } catch (err) {
      showError(err.message || 'Une erreur est survenue.');
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
